<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Két Sắt Bí Mật 🔒</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle, #1a252f 0%, #0f141a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* Khung két sắt tổng thể */
    .safe-box {
      width: 360px;
      height: 520px;
      background: #111418;
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), inset 0 2px 4px rgba(255,255,255,0.1);
      position: relative;
      border: 6px solid #2c3e50;
      perspective: 1500px;
    }

    /* Cánh cửa két (hiệu ứng 3D) */
    .safe-door {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2c3e50 0%, #1f2c38 100%);
      border-radius: 18px;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: left;
      transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 35px 25px;
      border-right: 4px solid #141c24;
      box-shadow: inset 12px 0 25px rgba(0,0,0,0.3);
      z-index: 2;
    }

    /* Khi mở cửa */
    .safe-box.open .safe-door {
      transform: rotateY(-115deg);
      box-shadow: 20px 20px 40px rgba(0,0,0,0.5);
    }

    /* Tiêu đề két */
    .safe-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .safe-header h2 {
      color: #ecf0f1;
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .safe-header .sub-text {
      font-size: 11px;
      color: #95a5a6;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* Màn hình hiển thị số LED */
    .screen-container {
      background: #080b0e;
      border-radius: 10px;
      padding: 8px;
      border: 2px solid #34495e;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.8);
      margin-bottom: 25px;
      width: 100%;
    }

    .screen {
      width: 100%;
      height: 55px;
      background: #000;
      border-radius: 6px;
      color: #00ff66;
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 8px;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
    }

    .screen.error {
      color: #ff3333;
      text-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Bàn phím số hiện đại */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 250px;
    }

    .key {
      height: 52px;
      background: linear-gradient(145deg, #34495e, #2c3e50);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 600;
      font-family: 'Orbitron', sans-serif;
      color: #ecf0f1;
      cursor: pointer;
      box-shadow: 0 5px 0 #1a252f, 0 6px 10px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
      user-select: none;
    }

    .key:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1a252f, 0 2px 5px rgba(0,0,0,0.3);
    }

    .key-c {
      background: linear-gradient(145deg, #e74c3c, #c0392b);
      box-shadow: 0 5px 0 #962d22, 0 6px 10px rgba(0,0,0,0.3);
    }
    .key-c:active { box-shadow: 0 1px 0 #962d22, 0 2px 5px rgba(0,0,0,0.3); }

    .key-ok {
      background: linear-gradient(145deg, #2ecc71, #27ae60);
      box-shadow: 0 5px 0 #1e8449, 0 6px 10px rgba(0,0,0,0.3);
    }
    .key-ok:active { box-shadow: 0 1px 0 #1e8449, 0 2px 5px rgba(0,0,0,0.3); }

    /* Tay nắm cửa két sắc nét hơn */
    .handle {
      width: 14px;
      height: 90px;
      background: linear-gradient(90deg, #bdc3c7, #7f8c8d, #95a5a6);
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 8px;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.4);
    }

    /* Nội dung bên trong két */
    .safe-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f39c12 0%, #d35400 100%);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      box-sizing: border-box;
      text-align: center;
      z-index: 1;
    }

    .secret-img {
      width: 85%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border: 4px solid #fff;
      transform: rotate(-3deg);
    }

    .secret-note {
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #2c3e50;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      line-height: 1.5;
    }

    .close-btn {
      margin-top: 15px;
      background: #2c3e50;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #1a252f;
    }
  </style>
</head>
<body>

<div class="safe-box" id="safeBox">
  <!-- Phần quà bên trong két -->
  <div class="safe-content">
    <img src="https://media.giphy.com/media/26FLdmIp6wJr91J4Y/giphy.gif" class="secret-img" alt="Secret">

    <div class="secret-note">
      "Chúc mừng em đã mở được tim anh! Phần thưởng là ... tùy em chọn ❤️"
    </div>

    <button class="close-btn" onclick="location.href='/'">Đóng lại</button>
  </div>

  <!-- Cánh cửa két ngoài -->
  <div class="safe-door">
    <div class="safe-header">
      <h2>Két Sắt Bí Mật</h2>
      <div class="sub-text">Nhập mật mã để mở khóa</div>
    </div>

    <div class="screen-container">
      <div class="screen" id="screen"></div>
    </div>

    <div class="keypad">
      <div class="key" onclick="press('1')">1</div>
      <div class="key" onclick="press('2')">2</div>
      <div class="key" onclick="press('3')">3</div>
      <div class="key" onclick="press('4')">4</div>
      <div class="key" onclick="press('5')">5</div>
      <div class="key" onclick="press('6')">6</div>
      <div class="key" onclick="press('7')">7</div>
      <div class="key" onclick="press('8')">8</div>
      <div class="key" onclick="press('9')">9</div>
      <div class="key key-c" onclick="clearScreen()">C</div>
      <div class="key" onclick="press('0')">0</div>
      <div class="key key-ok" onclick="checkCode()">OK</div>
    </div>

    <div class="handle"></div>
  </div>
</div>

<script>
  // --- CẤU HÌNH MẬT MÃ Ở ĐÂY ---
  const SECRET_CODE = "39174013";

  let currentInput = "";
  const screen = document.getElementById('screen');
  const safeBox = document.getElementById('safeBox');

  function press(num) {
    if (currentInput.length < 10) {
      currentInput += num;
      updateScreen();
    }
  }

  function clearScreen() {
    currentInput = "";
    screen.classList.remove('error');
    updateScreen();
  }

  function updateScreen() {
    screen.innerText = "*".repeat(currentInput.length);
  }

  function checkCode() {
    if (currentInput === SECRET_CODE) {
      screen.style.color = "#00ff66";
      screen.innerText = "OPEN";
      setTimeout(() => {
        safeBox.classList.add('open');
      }, 600);
    } else {
      screen.innerText = "ERR";
      screen.classList.add('error');

      setTimeout(() => {
        clearScreen();
      }, 1000);
    }
  }
</script>

</body>
</html>
