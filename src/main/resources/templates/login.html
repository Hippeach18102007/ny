<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Verification ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            background-image: radial-gradient(circle, #ffccd5 0%, #ff758c 100%);
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng trái tim bay nền */
        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            width: 20px;
            height: 20px;
            transform: rotate(45deg);
            animation: float 6s linear infinite;
            bottom: -30px;
        }

        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .heart::before { top: -10px; left: 0; }
        .heart::after { left: -10px; top: 0; }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(45deg) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(45deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Khung đăng nhập chính dạng Glassmorphism */
        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(255, 107, 107, 0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 2;
            animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .icon-lock {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff4757;
            font-size: 28px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            color: #636e72;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #dfe6e9;
            border-radius: 50px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            text-align: center;
            background: #fff;
            color: #2d3436;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input[type="password"]:focus {
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.3), inset 0 2px 4px rgba(0,0,0,0.02);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #ff3838 0%, #ff4757 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.5);
        }

        button:active {
            transform: translateY(-1px);
        }

        .error {
            color: #ff4757;
            font-size: 0.9rem;
            margin-top: 15px;
            display: block;
            font-weight: 600;
        }
        /* Tabs chọn người đăng nhập */
        .tabs { display: flex; gap: 10px; margin-bottom: 22px; }
        .tabs .tab {
            flex: 1; width: auto; padding: 12px 8px; font-size: 15px;
            background: #fff; color: #ff4757; border: 2px solid #ffccd5;
            box-shadow: none; transform: none;
        }
        .tabs .tab:not(.active):hover { background: #fff0f3; transform: none; box-shadow: none; }
        .tabs .tab.active,
        .tabs .tab.active:hover {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: #fff; border-color: transparent; transform: none;
        }
        .btn-him {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        .btn-him:hover {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>

<!-- Hiệu ứng trái tim bay phía sau -->
<div class="floating-hearts">
    <div class="heart" style="left: 10%; animation-duration: 5s; width: 15px; height: 15px;"></div>
    <div class="heart" style="left: 25%; animation-duration: 7s; animation-delay: 1s;"></div>
    <div class="heart" style="left: 40%; animation-duration: 4s; animation-delay: 2s; width: 25px; height: 25px;"></div>
    <div class="heart" style="left: 60%; animation-duration: 6s; animation-delay: 0.5s;"></div>
    <div class="heart" style="left: 75%; animation-duration: 8s; animation-delay: 3s; width: 18px; height: 18px;"></div>
    <div class="heart" style="left: 90%; animation-duration: 5.5s; animation-delay: 1.5s;"></div>
</div>

<div class="login-card">
    <div class="icon-lock">💖</div>
    <h1>Love Code</h1>

    <div class="tabs">
        <button type="button" class="tab active" data-target="her">👩 For Her</button>
        <button type="button" class="tab" data-target="him">👨 For Him</button>
    </div>

    <!-- Phần của bạn nữ -->
    <div class="panel" id="panel-her">
        <p>Please enter our anniversary date (or the password I gave you) to open this special letter!</p>
        <form action="/login" method="post">
            <div class="input-group">
                <input type="password" name="password" placeholder="Enter secret password..." required>
            </div>
            <button type="submit">Unlock Our Love ❤️</button>
            <span class="error" th:if="${error}" th:text="${error}"></span>
        </form>
    </div>

    <!-- Phần của bạn nam -->
    <div class="panel" id="panel-him" style="display:none">
        <p>Your desk for writing love letters to her.</p>
        <form action="/anh-viet-thu/login" method="post">
            <div class="input-group">
                <input type="password" name="password" placeholder="Your secret password..." required>
            </div>
            <button type="submit" class="btn-him">Open Letter Desk 💙</button>
            <span class="error" th:if="${param.adminErr}">Wrong password!</span>
        </form>
    </div>
</div>
<script>
    const tabs = document.querySelectorAll('.tab');

    function showTab(name) {
        tabs.forEach(t => t.classList.toggle('active', t.dataset.target === name));
        document.getElementById('panel-her').style.display = name === 'her' ? 'block' : 'none';
        document.getElementById('panel-him').style.display = name === 'him' ? 'block' : 'none';
    }

    tabs.forEach(t => t.addEventListener('click', () => showTab(t.dataset.target)));

    // Quay lại từ trang của anh / sai mật khẩu của anh -> mở sẵn tab "For Him"
    const q = new URLSearchParams(location.search);
    if (q.has('adminErr') || q.get('role') === 'boy') showTab('him');
</script>
</body>
</html>
